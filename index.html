<!DOCTYPE html>
<html>
    <head>
        <title>Git Stach practice</title>

        <link rel="stylesheet" href="./index.css" />
        <meta name="viewport" content="width= device-width", initial-scale="1">
        
        <!-- Bootstrap cdn links -->
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    </head>
    <body class="bg-dark">
        <div class="container-fluid mt-3">
            <div class="p-3  border border-3 border-light rounded rounded-lg">
                <div class="row">
                    <div class="col-12 col-md-12">
                        <form class="position-relative mt-5 ">
                            <div class="text-center">
                                <!-- <span class="bg-primary m-auto text-primary"> -->
                                    <i class="bi bi-person-circle personIcon bg-white rounded-circle text-primary border-3 border-danger"></i>
                                <!-- </span> -->
                                <br/>
                            
                                <h1 class="text-light">CUSTOMER LOGIN</h1>
                            </div>
                            
                            <div class="field input-group mb-1">
                                <div class="col-12 col-md-12 text-center m-auto">
                                    <div class=" input-group-text d-flex align-items-center justify-content-center">
                                       
                                       <div>
                                        <label for="emailId" class=""> 
                                            <i class="bi bi-person p-1 fs-3"></i>
                                        </label>

                                       </div> 
                                       <div>
                                        <input type="text" 
                                            class="form-control border border-none inputIcon"
                                            placeholder="Email ID" id="emailId" ></input>

                                       </div>
                                        
                                    </div>
                                    
                                </div>
                            </div>

                             <div class="field input-group">
                                <div class="col-12 col-md-12 text-center m-auto">
                                    <div class=" input-group-text d-flex align-items-center justify-content-center">
                                       
                                       <div>
                                        <label for="password" class=""> 
                                            <i class="bi bi-file-lock p-1 fs-3"></i>
                                        </label>

                                       </div> 
                                       <div>
                                        <input type="text" 
                                            class="form-control border border-none inputIcon"
                                            placeholder="Email ID" id="password" ></input>

                                       </div>
                                        
                                    </div>
                                    
                            
                                    
                                </div>
                            </div>
                            
                           

                            <div class="row justify-content-center p-1">
                                <div class="row col-md-12  d-flex justify-content-between">
                                    <div class="col-12 col-md-6">
                                        <span class="text-light">
                                            <input type="checkbox">Remember me</input>
                                        </span>

                                    </div>
                                     <div class="col-12 col-md-6 text-end ">
                                        <span class="text-light">
                                            Forget password?
                                        </span>

                                    </div>
                                    
                                </div>
                                

                            </div>


                            <!-- Login Buttons  -->
                             <div class="row mt-1 d-flex justify-content-center">
                                <span class="col-12 col-md-12 p-1">
                                    <button class="btn btn-primary w-100">Login</button>
                                </span>

                             </div>
                            
                            

                        </form>
                       

                    </div>
                
                </div>
            </div>
        </div>
       

         <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    </body>
</html>
